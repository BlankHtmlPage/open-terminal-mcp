name: Bug Report
description: Report a bug
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Security
      options:
        - label: I have not pasted tokens, .env contents, or real hostnames into this report.
          required: true
  - type: textarea
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    attributes:
      label: Environment
      description: OS, Node version, and any relevant configuration (do not include secrets).
  - type: textarea
    attributes:
      label: Additional context
      description: Any other context or logs (redact secrets).
